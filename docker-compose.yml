services:
  db:
    # pgvector/pgvector:pg16 is the upstream pgvector-bundled Postgres 16 image.
    # Same data dir layout as postgres:16-alpine — drop-in replacement for the
    # existing volume. Required for note_embeddings + RAG (Phase 1+).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    # Local LLM runtime. Models persist in the named volume across restarts.
    # No external port — accessed only over the internal docker network at
    # http://ollama:11434. After first start, pull models manually:
    #   docker compose exec ollama ollama pull qwen3:8b
    #   docker compose exec ollama ollama pull nomic-embed-text
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Keep models warm for 10 min after last request — avoids 30s reload on
      # bursty user activity. Set OLLAMA_KEEP_ALIVE=-1 to pin forever.
      OLLAMA_KEEP_ALIVE: "10m"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # One-shot migration runner. Blocks `api` from starting until migrations
  # complete, so a rolling restart never serves traffic against a half-migrated DB.
  migrator:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/jarvis
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/jarvis
      SECRET_KEY: dev-secret-key-change-in-production-must-be-long-enough
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: jarvis
      S3_PUBLIC_URL: http://localhost:9000/jarvis
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      # Local LLM via Ollama. Resolved over internal docker network.
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen3:8b
      EMBED_MODEL: nomic-embed-text
    volumes:
      # Persist migrations on host so they survive rebuilds
      - ./backend/alembic/versions:/app/alembic/versions
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request,sys; sys.exit(0 if
          urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3).status==200
          else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      # Note: ollama is intentionally NOT a hard dependency. If the LLM
      # runtime is down, only AI features should degrade (returning 503);
      # the rest of the app must keep serving.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  ollama_models:
