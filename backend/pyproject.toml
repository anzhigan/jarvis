[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Jarvis — Personal Knowledge Base API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.4.0",  # CVE-2024-33664 fixed in 3.4.0
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.18",  # CVE-2024-53981 fixed in 0.0.18
    "boto3>=1.34.0",
    "pillow>=11.1.0",  # newer 10.x range had CVEs; bump to 11.1+
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pgvector>=0.3.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
]

[tool.setuptools]
# Without this, setuptools' auto-discovery sees both `app/` and `alembic/`
# at the top level and refuses to build. We only ship `app/` as a package;
# `alembic/` is migration scripts run via the alembic CLI, not importable code.
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
