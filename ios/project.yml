# xcodegen project spec — generates Jarvnote.xcodeproj on `xcodegen generate`.
# Source of truth for project structure; keep .xcodeproj out of git.

name: Jarvnote
options:
  bundleIdPrefix: ru.jarvnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

# ── Build configurations ──────────────────────────────────────────────────
# Debug points at local backend, Release at production. Build settings inject
# API_BASE_URL into Info.plist so the app reads it as a Bundle key at runtime.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "2.2.6"
    CURRENT_PROJECT_VERSION: "33"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Jarvnote:
    type: application
    platform: iOS
    # xcodegen autodetects resource types from extensions inside listed paths.
    # Listing Sources + Resources under `sources` lets it pick up code, the
    # asset catalog, the launch storyboard, and the fonts folder in one pass.
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
      # Resources/Fonts intentionally omitted — see UIAppFonts comment below.
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Jarvnote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        # Permissions — surfaced in the App Privacy disclosures later.
        NSFaceIDUsageDescription: Use Face ID to unlock Jarvnote.
        NSPhotoLibraryUsageDescription: Pick photos to attach to notes.
        NSCameraUsageDescription: Capture photos to attach to notes.
        # Custom fonts intentionally NOT declared in UIAppFonts: the TTF
        # files aren't bundled yet (Theme.Font checks UIFont registration
        # and falls back to .system(design: .serif), which renders New York
        # — visually close to Fraunces). Listing names without bundling the
        # files just spams FontParser warnings on every cold start.
        # Read at runtime via Bundle.main.object(forInfoDictionaryKey:).
        APIBaseURL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.jarvnote.app
        PRODUCT_NAME: Jarvnote
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Code signing — automatic with the developer's team. Team ID is
        # baked into project.yml so `xcodebuild archive` works without
        # opening Xcode first.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DCJFXJ4F8H
        # Disable previews-only optimisations during normal Debug builds.
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          API_BASE_URL: "http://localhost:8000/api/v1"
        Release:
          API_BASE_URL: "https://jarvnote.ru/api/v1"

# ── Schemes ──────────────────────────────────────────────────────────────
# Default scheme runs the Jarvnote target. xcodegen generates this automatically;
# explicit declaration here lets us pin Build Configuration per action later.
schemes:
  Jarvnote:
    build:
      targets:
        Jarvnote: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
