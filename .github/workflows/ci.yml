name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/
      - name: Static security scan (bandit)
        working-directory: backend
        # -ll = report only Medium+ severity. Tweak baseline as the codebase grows.
        run: bandit -r app/ -ll
      - name: Dependency CVE scan (pip-audit)
        working-directory: backend
        # Audit the locked transitive set, excluding our own editable install
        # (pip-audit can't query unpublished packages on PyPI).
        run: |
          pip freeze --exclude-editable > /tmp/audit-deps.txt
          pip-audit --strict --progress-spinner off -r /tmp/audit-deps.txt
      - name: Run migrations against ephemeral postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jarvis_test
          SECRET_KEY: test-secret-key-please-do-not-use-in-production-32chars
        run: alembic upgrade head
      - name: Run tests with coverage gate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jarvis_test
          SECRET_KEY: test-secret-key-please-do-not-use-in-production-32chars
        run: pytest tests/ -v --cov=app --cov-report=term --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Dependency CVE scan (npm audit)
        working-directory: frontend
        # Fail on high+critical only — moderate findings clutter the signal.
        run: npm audit --audit-level=high
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test with coverage gate
        working-directory: frontend
        # Threshold starts intentionally low (40%) — raise as features/* hooks
        # gain unit tests in follow-up phases.
        run: npm run test:coverage
      - name: Build
        working-directory: frontend
        env:
          VITE_ANALYZE: '1'
        run: npm run build
      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-stats
          path: frontend/dist/bundle-stats.html
          retention-days: 14
          if-no-files-found: warn
