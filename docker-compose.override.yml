# ─────────────────────────────────────────────────────────────────────────
# LOCAL DEV OVERRIDE (auto-applied by `docker compose up`).
#
# Purpose: keep the local db/minio volumes usable — they were initialised
# with the passwords in `.env`, so hardcoded defaults from the base file
# would fail the auth. This override just re-injects the .env values.
#
# Ollama is intentionally NOT re-added here — locally we hit the native
# host-side Ollama via `host.docker.internal:11434` (already set in the
# base file). Metal-accelerated, no CPU-only container needed.
#
# For VPS deploys use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  migrator:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/jarvis

  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/jarvis
      SECRET_KEY: ${SECRET_KEY}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
