<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jarvnote</title>
    <!-- Indigo Editorial v4 fonts: Fraunces (display), Source Serif 4 (body), Inter (UI), JetBrains Mono. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Weight ranges bumped 600 → 700 for Fraunces + Source Serif 4 so the
         note title renders truly bold (the previous 600 ceiling left
         Cyrillic — which falls through to Source Serif 4 because Fraunces
         is Latin-only — looking visibly thinner than its Latin sibling). -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
