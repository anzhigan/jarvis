# Pre-commit hooks. Install once with `pip install pre-commit && pre-commit install`.
# Run on demand: `pre-commit run --all-files`.
#
# These exist to catch boring issues (whitespace, lint) before they reach CI.
# CI is still authoritative — pre-commit is the fast local check.
repos:
  # ─── Generic hygiene ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown line-ending double-space is meaningful (line break).
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # ─── Backend (Python) ──────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        files: ^backend/

  # ─── Frontend (TS/JS/CSS/MD) ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|md|json|yml|yaml)$
        # Use the project's prettier config (frontend/.prettierrc or package.json prettier key).
        additional_dependencies:
          - prettier@3.3.3
